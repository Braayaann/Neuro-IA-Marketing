services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: neuroia
      POSTGRES_USER: neuro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - neuroia_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuro -d neuroia"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  neuroia_pg:
